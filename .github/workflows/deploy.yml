name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# In the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The site is served from the ROOT of a custom domain (set in Settings →
      # Pages), so assets resolve from /. If the custom domain is ever removed,
      # this must go back to /${{ github.event.repository.name }}/ (and
      # public/404.html's pathSegmentsToKeep back to 1) for the
      # <user>.github.io/<repo>/ subpath to work.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          # Google Analytics 4 measurement ID (G-XXXXXXXXXX). Set it at
          # Settings → Secrets and variables → Actions → Variables. Left unset,
          # the build ships with analytics entirely absent — no script, no
          # cookie, no request (see src/lib/analytics.js). It is a variable
          # rather than a secret because a measurement ID is public by design.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
